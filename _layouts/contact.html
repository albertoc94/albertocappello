---
layout: default
---

<h1 class="visually-hidden">{{ page.title }}</h1>

<section class="section">
  <h2 class="eyebrow">Contact</h2>
  {{ content }}
</section>

<section class="section">
  <h2 class="eyebrow">References</h2>
  <ul class="refs">
    {% for contact in site.data.settings.contacts %}
      <li>
        <h3 class="refs__name">{{ contact.name }}</h3>
        <p class="refs__meta">
          {{ contact.institution }}<br>
          <a href="mailto:{{ contact.email }}">{{ contact.email }}</a>
        </p>
      </li>
    {% endfor %}
  </ul>
</section>
