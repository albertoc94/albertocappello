---
layout: default
---

<h1 class="visually-hidden">{{ page.title }}</h1>

<section class="section">
  <h2 class="eyebrow">Teaching</h2>
  {{ content }}

  <ul class="course-list">
    {% for course in site.data.settings.courses %}
      <li>
        <h3 class="course-list__name">
          <a href="{{ site.github.url }}/courses/{{ course.url }}">{{ course.name }}</a>
        </h3>
        <p class="course-list__meta">
          {{ course.institution }}{% if course.term %} · {{ course.term }}{% endif %}{% if course.role %} · {{ course.role }}{% endif %}
        </p>
      </li>
    {% endfor %}
  </ul>
</section>
