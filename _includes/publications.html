<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">Job Market Paper</h3>

    {% if page.title == "Home" %}
      {% assign pubs = site.data.publications.featured %}
    {% else %}
      {% assign pubs = site.data.publications.index %}
    {% endif %}

    {% for item in pubs %}
      <p class="mb-1">
        <a href="{{ item.url | relative_url }}">{{ item.name }}</a>
      </p>
      {% if item.slides_url %}
        <p class="mt-0">
          <small><a href="{{ item.slides_url | relative_url }}">Slides</a></small>
        </p>
      {% endif %}
    {% endfor %}
  </div>
</div>
