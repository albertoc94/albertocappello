<aside class="sidebar">
  <img class="sidebar__photo" src="{{ site.github.url }}/assets/img/profile_photo.jpg" alt="{{ site.title }}">

  <p class="sidebar__role">
    <strong>{{ site.role }}</strong>
    {{ site.affiliation }}
  </p>

  <div class="sidebar__meta">
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p><a href="{{ site.github.url }}/{{ site.cv }}" target="_blank" rel="noopener">Curriculum Vitae (PDF)</a></p>
    <p><a href="{{ site.profile_url }}" target="_blank" rel="noopener">Lab profile</a></p>
  </div>
</aside>
