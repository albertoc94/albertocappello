featured:
  - name: "Participation and Spending in the Medicare Shared Savings Program"
    url: "research/JMP_AlbertoCappello.pdf"
    slides_url: "research/JMP_Slides_Spring2026.pdf"
    abstract: >
      The Medicare Shared Savings Program (MSSP) is a voluntary program that provides incentive
      payments to healthcare providers that form integrated healthcare organizations, known as
      Accountable Care Organizations (ACOs). The MSSP rewards ACOs for keeping average per capita
      spending below a benchmark. I provide reduced-form and model-based evidence that the current
      benchmark design adversely affects ACOs' participation and performance in the MSSP. First,
      the benchmark rebasement, which updates the benchmark over time to reflect observed ACOs'
      spending, causes the ratchet effect: ACOs delay spending reductions to avoid lowering future
      benchmarks. Second, the region-specific adjustment applied to the rebased benchmark induces
      adverse selection: ACOs that are most likely to enroll are those with initial spending below
      the benchmark. Moreover, I propose a revised benchmarking methodology to address these
      inefficiencies. Counterfactual analyses demonstrate that this alternative policy mitigates
      adverse selection without introducing ratchet effect and significantly increases Medicare
      savings.

index:
  - name: "Can Hospitals Efficiently Integrate Health Care Financing and Delivery?"
    url: "research/VI_healthplans_draft.pdf"
    coauthors:
      - {name: 'Ira Abraham', url: 'https://sites.google.com/bc.edu/iraabraham/home'}
      - {name: 'Diana Bowser', url: 'https://www.bc.edu/bc-web/schools/cson/faculty-research/faculty-directory/diana-m--bowser.html'}
    abstract: >
      Some hospitals integrate health care financing and delivery by sponsoring a health
      plan. Whether this arrangement improves patient outcomes depends on whether plan
      ownership changes how hospitals deliver care. We study emergency admissions among
      Medicare Advantage beneficiaries and instrument for admission to a plan-sponsoring
      hospital using differential distance and ambulance companies’ historical destination
      patterns. In the full sample, we find little evidence that admission to a plan-sponsoring
      hospital changes 30-day all-cause unplanned readmissions, while 30-day mortality is
      lower. In local hospital markets with lower concentration (HHI below 1,800), the estimates
      imply a 12.4 percentage point reduction in readmission and a 5.6 percentage point reduction 
      in mortality. The corresponding estimates are smaller and not statistically distinguishable
      from zero in concentrated markets (HHI of 1,800 or above). Because these estimates come from 
      separate subsamples, they do not identify competition as the cause of the difference. The 
      results suggest that hospital sponsorship of a health plan can lead hospitals to improve 
      patient outcomes, but that the benefits vary strongly across markets with different levels of competition.


  - name: "Spillover Effects between Medicare Programs"
    url: "research/Spillover_Paper_AIY.pdf"
    coauthors:
      - {name: 'Ira Abraham', url: 'https://sites.google.com/bc.edu/iraabraham/home'}
      - {name: 'Yunus Coskun', url: 'https://www.yunussemihcoskun.com/'}
    abstract: >
      Medicare relies on multiple programs that provide coverage to different groups of
      beneficiaries. The Medicare Shared Savings Program (MSSP) introduces incentives
      to reduce unnecessary spending for Traditional Medicare (TM) beneficiaries. Changes
      induced by the MSSP can spill over to beneficiaries enrolled in Medicare Advantage
      (MA) and affect MA plans’ outcomes. The MSSP can affect MA through two channels.
      First, a benchmark channel : because MA plans payments are tied to county-level
      TM per-capita spending, MSSP-induced changes in county-level TM spending can
      mechanically affect MA plan payments. Second, a provider channel : because providers
      treat both TM and MA beneficiaries, MSSP-induced changes in care delivery may
      directly affect MA enrollees and, in turn, plan expected costs and benefit design.
      We measure the plan-level exposure to MSSP activity as the enrollment-weighted
      average of the county MSSP penetration in the counties that are part of the plan service
      area. We identify the provider channel by controlling for the plan-level payments to net
      out the mechanical effect that operates through the benchmark channel. We leverage
      quasi-experimental variation created by the 2019 Pathways to Success reform of the
      MSSP, which shifted the strength of MSSP incentives. Combining this policy variation
      with pre-reform plan shares and MSSP providers penetration, we construct a Bartik-
      style instrument for plan-level exposure to MSSP activity.
      We find evidence that greater MSSP exposure lowers MA plans’ expected cost of
      coverage which, in turn, reduces MA payment to plans. In particular, a 1% increase in
      MSSP exposure lowers plans’ expected costs by 0.34% and lower plans’ payments by
      about 0.20%. Moreover, part of this lower costs are passed through to enrollees through
      higher rebates. However, we interpret the estimation on rebates more cautiously as
      the instrument is correlated with pre-2019 trend in rebates. We also find that plan
      ownership plays an important role: spillovers are not significant among plans sponsored
      by health systems that participate in the MSSP.
