featured:
  - name: "Participation and Spending in the Medicare Shared Savings Program"
    url: "publications/JMP_AlbertoCappello.pdf"
    slides_url: "publications/JMP_Slides_Spring2026.pdf"
    abstract: >
      The Medicare Shared Savings Program (MSSP) is a voluntary program that provides incentive
      payments to healthcare providers that form integrated healthcare organizations, known as
      Accountable Care Organizations (ACOs). The MSSP rewards ACOs for keeping average per capita
      spending below a benchmark. I provide reduced-form and model-based evidence that the current
      benchmark design adversely affects ACOs' participation and performance in the MSSP. First,
      the benchmark rebasement, which updates the benchmark over time to reflect observed ACOs'
      spending, causes the ratchet effect: ACOs delay spending reductions to avoid lowering future
      benchmarks. Second, the region-specific adjustment applied to the rebased benchmark induces
      adverse selection: ACOs that are most likely to enroll are those with initial spending below
      the benchmark. Moreover, I propose a revised benchmarking methodology to address these
      inefficiencies. Counterfactual analyses demonstrate that this alternative policy mitigates
      adverse selection without introducing ratchet effect and significantly increases Medicare
      savings.

index:
  - name: "The Impact of Hospital-Sponsored Health Plans on Readmission Rates"
    url: "publications/VI_healthplans_draft.pdf"
    abstract: >
      Provider-sponsored health plans (PSHPs) are a form of integration between health
      care financing (plans) and health care delivery systems (hospitals). This paper studies
      30-day unplanned readmissions among Medicare Advantage beneficiaries and distinguishes 
      between two margins of integration: treatment at an integrated hospital and
      enrollment in an integrated plan. We address two sources of endogeneity-patient
      selection and supply side selection. To address patient selection, we develop an
      instrumental-variables design that (i) leverages quasi-experimental variation in 
      hospital assignment generated by the ambulance transportation in emergency care episodes
      and (ii) exploits plausibly exogenous variation in integrated plan availability across
      county borders. To address supply-side selection, we include hospital and plan fixed
      effects within a two-way fixed effects linear probability model, thereby controlling for
      time-invariant differences in provider and insurer characteristics. We find in markets
      where hospital competition is stronger, patients admitted to an integrated hospital-
      plan setting have 9.5 pp lower readmission risk relative to those admitted to standard
      hospitals. Secondly, the reduction in readmission risk is not driven by longer inpatient
      stay at the hospital. Third, after controlling for the admitting hospital, we do not
      find evidence that enrollment in a vertically integrated health plan reduces readmission rates.
      Together, these findings indicates that, in competitive hospital markets, 
      this lower readmission risk operate through hospital-wide care practice changes at an
      integrated hospital rather than through the enrollment in an integrated plan.


  - name: "Spillover Effects between Medicare Programs"
    url: "publications/Spillover_Paper_AIY.pdf"
    abstract: >
      Medicare’s major coverage programs share providers, creating scope for spillovers across segments. 
      We study whether incentives in the Medicare Shared Savings Program (MSSP) spill over from Traditional
      Medicare to Medicare Advantage (MA). The MSSP can affect MA through two channels. First, "benchmark channel":
      because MA benchmarks are tied to local fee-for-service spending, MSSP-induced spending reductions mechanically
      lower MA plan payments. Second, "provider channel": because providers treat both Traditional Medicare and
      MA beneficiaries, MSSP-induced changes in care delivery may spill over directly to MA enrollees.
      We focus on the provider channel. To study it, we condition on plan-level MA benchmarks and exploit quasi-experimental
      variation generated by the 2019 Pathways to Success reform, which changed the timing of non-rebasing years by
      MSSP entry cohort and thereby altered the strength of savings incentives. Combining this policy variation with pre-reform
      county ACO shares and baseline plan enrollment weights, we construct a Bartik-style instrument for plan-level exposure to MSSP activity.
      We find that greater MSSP exposure lowers MA plans’ expected cost of coverage and increases plan generosity. A 1% increase
      in exposure reduces expected cost per beneficiary by 0.17%, increases rebates by 2.1%, lowers out-of-pocket maxima by 0.37%,
      and raises the probability of offering a zero-premium plan by 0.57 pp. The results imply that MSSP affects MA
      not only mechanically through benchmarks, but also through provider behavior that spills over across Medicare programs.
