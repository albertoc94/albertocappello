featured:
  - name: "Participation and Spending in the Medicare Shared Savings Program"
    url: "publications/JMP_AlbertoCappello.pdf"
    slides_url: "publications/JMP_Slides_Fall2025.pdf"
    abstract: >
      The Medicare Shared Savings Program (MSSP) is a voluntary program that provides incentive payments
      to healthcare providers that form integrated healthcare organizations, known as Accountable Care Organizations (ACOs). 
      The MSSP rewards ACOs for keeping average per capita spending below a benchmark. I provide reduced-form and model-based 
      evidence that the current benchmark design adversely affects ACOs' participation and performance in the MSSP. First, 
      the benchmark rebasement, which updates the benchmark over time to reflect observed ACOs' spending, causes the ratchet 
      effect: ACOs delay spending reductions to avoid lowering future benchmarks. Second, the region-specific adjustment applied 
      to the rebased benchmark induces adverse selection: ACOs that are most likely to enroll are those with initial spending 
      below the benchmark. Moreover, I propose a revised benchmarking methodology to address these inefficiencies. Counterfactual
      analyses demonstrate that this alternative policy mitigates adverse selection without introducing ratchet effect and significantly
      increases Medicare savings.

